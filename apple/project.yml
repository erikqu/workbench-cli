name: WorkbenchRemote
options:
  bundleIdPrefix: dev.workbench
  deploymentTarget:
    iOS: "17.0"
packages:
  WorkbenchCore:
    path: .
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    WORKBENCH_RELAY_URL: ""
targets:
  WorkbenchRemote:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: WorkbenchCore
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.workbench.remote
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/WorkbenchRemote.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Workbench
        WorkbenchRelayURL: $(WORKBENCH_RELAY_URL)
        NSCameraUsageDescription: Scan the pairing code displayed by your Workbench companion.
        NSLocalNetworkUsageDescription: Connect to a local development relay when testing.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: dev.workbench.remote.pair
            CFBundleURLSchemes: [workbench-remote]
    entitlements:
      path: App/WorkbenchRemote.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    preBuildScripts:
      - name: Generate app icon
        script: 'swift "$SRCROOT/../scripts/make-icon.swift" "$SRCROOT/App/Assets.xcassets/AppIcon.appiconset/icon.png"'
        outputFiles: ["$(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/icon.png"]
schemes:
  WorkbenchRemote:
    build:
      targets:
        WorkbenchRemote: all
    run:
      config: Debug
    archive:
      config: Release
