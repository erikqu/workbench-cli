name: WorkbenchRemote
options:
  bundleIdPrefix: dev.workbench
  deploymentTarget:
    iOS: "17.0"
packages:
  WorkbenchCore:
    path: .
  SwiftTerm:
    path: Vendor/SwiftTerm
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.71"
    CURRENT_PROJECT_VERSION: 2
    WORKBENCH_RELAY_URL: ""
    WORKBENCH_AUTH_MODE: pairing
targets:
  WorkbenchRemote:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: WorkbenchCore
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erikqu.workbenchremote
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/WorkbenchRemote.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Workbench
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WorkbenchRelayURL: $(WORKBENCH_RELAY_URL)
        WorkbenchAuthMode: $(WORKBENCH_AUTH_MODE)
        NSCameraUsageDescription: Scan the pairing code displayed by your Workbench companion.
        NSLocalNetworkUsageDescription: Connect to a local development relay when testing.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: dev.workbench.remote.pair
            CFBundleURLSchemes: [workbench-remote]
    entitlements:
      path: App/WorkbenchRemote.entitlements
      properties:
        {}
    preBuildScripts:
      - name: Generate app icon
        script: 'env -u SDKROOT -u PLATFORM_NAME -u EFFECTIVE_PLATFORM_NAME swift "$SRCROOT/../scripts/make-icon.swift" "$SRCROOT/App/Assets.xcassets/AppIcon.appiconset/icon.png"'
        inputFiles: ["$SRCROOT/../scripts/make-icon.swift"]
        outputFiles: ["$(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/icon.png"]
  WorkbenchRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: WorkbenchRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WorkbenchRemote
        CODE_SIGN_ENTITLEMENTS: ""
schemes:
  WorkbenchRemote:
    build:
      targets:
        WorkbenchRemote: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [WorkbenchRemoteUITests]
    archive:
      config: Release
