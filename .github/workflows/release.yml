name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  source:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Package CLI and monorepo sources
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: release/*
          if-no-files-found: error

  host:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/remote
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/remote/package-lock.json
      - run: npm ci
      - run: npm run package:host
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.os }}-release
          path: |
            apps/remote/release/host/*.tar.gz
            apps/remote/release/host/*.sha256
          if-no-files-found: error

  publish:
    # Manual branch runs qualify every package without publishing a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source, host]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "*-release"
          merge-multiple: true
      - name: Verify every archive before publication
        working-directory: release
        run: sha256sum --check ./*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
